defaults:
  - ppo_trainer
  - _self_
hydra:
  searchpath:
    - pkg://verl/trainer/config
data:
  apply_chat_template_kwargs:
    enable_thinking: false
  train_files: ${oc.env:APPWORLD_GRPO_TRAIN,artifacts/appworld_grpo/train_custom.parquet}
  val_files: ${oc.env:APPWORLD_GRPO_VAL,artifacts/appworld_grpo/dev_custom.parquet}
  train_batch_size: 4
  gen_batch_size: 4
  max_prompt_length: 60000
  max_response_length: 100000
  prompt_key: prompt
  return_raw_chat: true
  shuffle: false
  filter_overlong_prompts: true
  truncation: left
  # Keep validation in-process until the worker lifecycle is proven stable.
  dataloader_num_workers: 0
actor_rollout_ref:
  model:
    path: ${oc.env:APPWORLD_MODEL,models/Qwen3.5-4B-sft-final}
    tokenizer_path: ${oc.env:APPWORLD_MODEL,models/Qwen3.5-4B-sft-final}
    trust_remote_code: true
    enable_gradient_checkpointing: true
    enable_activation_offload: true
    use_remove_padding: true
    use_fused_kernels: true
    fused_kernel_options: {impl_backend: torch}
    override_config: {attn_implementation: sdpa}
    lora_rank: 0
    lora_alpha: 0
    target_modules: null
  actor:
    strategy: fsdp
    grad_clip: 1.0
    fsdp_config: {param_offload: true, optimizer_offload: true, model_dtype: bfloat16}
    optim: {lr: 5.0e-6, lr_warmup_steps_ratio: 0.05}
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 160000
    ulysses_sequence_parallel_size: 4
    use_kl_loss: false
    checkpoint:
      save_contents: [model]
      load_contents: [model]
  ref:
    model:
      path: ${oc.env:APPWORLD_MODEL,models/Qwen3.5-4B-sft-final}
      tokenizer_path: ${oc.env:APPWORLD_MODEL,models/Qwen3.5-4B-sft-final}
      trust_remote_code: true
      use_remove_padding: true
      override_config: {attn_implementation: sdpa}
    fsdp_config: {param_offload: true, model_dtype: bfloat16}
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 160000
  rollout:
    name: vllm
    mode: async
    n: 4
    temperature: 0.7
    top_p: 0.9
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.70
    prompt_length: 60000
    response_length: 100000
    max_model_len: 160000
    # One AppWorld trajectory is dispatched to one isolated worker.
    max_num_seqs: 16
    max_num_batched_tokens: 160000
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 160000
    calculate_log_probs: true
    free_cache_engine: true
    agent:
      default_agent_loop: appworld_agent
      # 4 prompts x rollout.n=4 are dispatched to 16 isolated agent sessions.
      num_workers: 16
      agent_loop_config_path: ${oc.env:APPWORLD_AGENT_LOOP_CONFIG,configs/appworld_agent_loop.yaml}
      agent_loop_manager_class: appworld_agentic_rl.verl_agent_loop_manager.AppWorldAgentLoopManager
    multi_turn:
      enable: true
      format: qwen3_coder
      max_user_turns: 48
      max_assistant_turns: 48
      max_parallel_calls: 1
      max_tool_response_length: 12000
      tool_response_truncate_side: middle
      tool_config_path: null
      function_tool_path: null
algorithm:
  adv_estimator: event_replay
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  turn_discount: {alpha: 1.05}
trainer:
  total_epochs: 1
  total_training_steps: null
  nnodes: 1
  n_gpus_per_node: 4
  save_freq: 10
  # Validation is run after training by run_appworld_grpo_formal.sh. Keeping
  # it out of the training loop avoids the known DataLoader worker shutdown
  # failure and makes checkpoint selection use the same independent evaluator.
  test_freq: -1
  val_before_train: false
  resume_mode: disable
  default_local_dir: ${oc.env:APPWORLD_GRPO_OUTPUT,artifacts/appworld_grpo/checkpoints_formal}
  logger: [console, wandb]
  project_name: appworld-agentic-rl
  experiment_name: appworld-grpo-lightweight-event-credit-formal
  critic_warmup: 0
